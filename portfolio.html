<style>
  .pf-header { padding: 56px 0 40px; border-bottom: 1px solid var(--border); }
  .pf-title { font-family: var(--font-display); font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
  .pf-subtitle { font-size: 13px; color: var(--muted); }

  .pf-notice { background: color-mix(in srgb, #f59e0b 10%, transparent); border: 1px solid color-mix(in srgb, #f59e0b 25%, transparent); border-radius: 10px; padding: 16px 20px; margin: 24px 0 0; font-size: 13px; color: var(--dim); line-height: 1.6; }
  .pf-notice code { font-family: monospace; font-size: 12px; background: var(--surface); padding: 2px 6px; border-radius: 4px; color: var(--text); }
  .pf-notice a { color: #f59e0b; text-decoration: underline; }

  .pf-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 32px 0; border-bottom: 1px solid var(--border); }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .stat-value { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .c-pos { color: #22c55e; }
  .c-neg { color: #ef4444; }
  .c-neu { color: var(--dim); }

  .pf-viz { display: flex; align-items: center; gap: 48px; padding: 32px 0; border-bottom: 1px solid var(--border); }
  .donut-wrap { flex-shrink: 0; }
  .donut-svg { width: 144px; height: 144px; }
  .legend { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .legend-row { display: flex; align-items: center; gap: 10px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { font-size: 13px; color: var(--dim); flex: 1; }
  .legend-val { font-size: 13px; font-weight: 600; color: var(--text); margin-right: 12px; }
  .legend-pct { font-size: 11px; color: var(--muted); min-width: 36px; text-align: right; }

  .pf-table-wrap { padding: 24px 0 56px; overflow-x: auto; }
  .pf-section-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 580px; }
  th { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 10px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child { text-align: left; padding-left: 0; }
  td { padding: 13px 10px; border-bottom: 1px solid var(--border); color: var(--dim); text-align: right; vertical-align: middle; }
  td:first-child { text-align: left; padding-left: 0; }
  tr:last-child td { border-bottom: none; }
  .asset-name { font-weight: 600; color: var(--text); font-size: 13.5px; }
  .asset-ticker { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: monospace; }
  .type-badge { font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 7px; border-radius: 4px; text-transform: uppercase; white-space: nowrap; }
  .type-crypto { background: color-mix(in srgb, #f59e0b 15%, transparent); color: #f59e0b; }
  .type-etf    { background: color-mix(in srgb, #0ea5e9 15%, transparent); color: #0ea5e9; }
  .type-action { background: color-mix(in srgb, #22c55e 15%, transparent); color: #22c55e; }
  .type-autre  { background: color-mix(in srgb, #a78bfa 15%, transparent); color: #a78bfa; }
  .price-live { color: var(--text); }
  .price-na { color: var(--muted); font-style: italic; }

  .pf-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 0 40px; font-size: 11px; color: var(--muted); }
  .pf-refresh { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; font-size: 11px; color: var(--dim); cursor: pointer; font-family: var(--font); transition: border-color .15s, color .15s; }
  .pf-refresh:hover { border-color: var(--text); color: var(--text); }

  .pf-loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 14px; }
  .pf-error { color: #ef4444; font-size: 13px; padding: 32px 0; }

  @media (max-width: 700px) {
    .pf-stats { grid-template-columns: 1fr 1fr; }
    .pf-viz { flex-direction: column; align-items: flex-start; gap: 24px; }
  }
</style>
</head>
<body>
<nav class="ht-nav">
  <div class="ht-nav-inner">
    <a class="ht-brand" href="index.html">Haito</a>
    <ul class="ht-nav-links">
      <li><a href="nilo.html">Nilo</a></li>

    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="Changer le thème"></button>
  </div>
</nav>

<div class="wrap">
  <header class="pf-header">
    <div class="pf-title">Portfolio</div>
    <div class="pf-subtitle">Épargne · Actions · Crypto · ETF</div>
  </header>
  <div id="pf-root"><div class="pf-loading">Chargement…</div></div>
</div>

<script src="assets/haito.js"></script>
<script>
// ── URL du sheet publié ───────────────────────────────────────────────────────
// Fichier → Partager → Publier sur le web → CSV → remplace ods par csv dans l'URL
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4SekTzISvavuM7C_R1uAejYVlUz3xy2_X0ssVp9xQ_UsiYG5WbjATDIlKRU52cYE_rTw4asJpa2Yn/pub?output=csv';
// Colonnes du sheet (ligne 1 = en-têtes) :
// A:Compte B:Classe C:Nom D:Symbole E:Quantité F:PrixMoyen
// G:PrixActuel(GOOGLEFINANCE — peut échouer → fallback sur F)
// L:APY_dividende  N:APY_staking  (indices 11 et 13)

const COLORS = { crypto:'#f59e0b', etf:'#0ea5e9', action:'#22c55e', autre:'#a78bfa' };
const LABELS = { crypto:'Crypto', etf:'ETF', action:'Action', autre:'Autre' };

function fmtEur(n, dec=2) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('fr-FR', { style:'currency', currency:'EUR', minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function fmtNum(n, dec=4) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('fr-FR', { minimumFractionDigits:0, maximumFractionDigits:dec });
}
function sign(n) { return n >= 0 ? '+' : ''; }
function pnlClass(n) { return n > 0 ? 'c-pos' : n < 0 ? 'c-neg' : 'c-neu'; }

function toNum(s) {
  if (s == null) return NaN;
  return parseFloat(String(s).replace(/\s/g,'').replace(',','.'));
}

function mapType(classe) {
  const c = (classe||'').toLowerCase().trim();
  if (c === 'crypto') return 'crypto';
  if (c === 'action') return 'action';
  if (c === 'etf')    return 'etf';
  return 'autre';
}

function parseCSVLine(line) {
  const cols = [];
  let cur = '', inq = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inq && line[i+1]==='"') { cur+='"'; i++; } else inq=!inq; continue; }
    if (c === ',' && !inq) { cols.push(cur.trim()); cur=''; continue; }
    cur += c;
  }
  cols.push(cur.trim());
  return cols;
}

function parseCSV(text) {
  const lines = text.replace(/\r/g,'').trim().split('\n');
  let fallbackCount = 0;
  const positions = lines.slice(1).map(line => {
    const c = parseCSVLine(line);
    const qty = toNum(c[4]);
    const avg = toNum(c[5]);
    if (!c[2] || isNaN(qty) || qty <= 0) return null;

    // Column G = prix actuel via GOOGLEFINANCE. Errors export as empty or "#..."
    const raw = (c[6] || '').trim();
    const isError = !raw || raw.startsWith('#') || raw === 'Erreur';
    const sheetPx = isError ? NaN : toNum(raw);
    if (isError) fallbackCount++;

    return {
      compte:  (c[0]||'DEFAULT').trim(),
      type:    mapType(c[1]),
      nom:     (c[2]||'').trim(),
      ticker:  (c[3]||'').trim(),
      qty,
      avgPrice:     isNaN(avg) ? 0 : avg,
      currentPrice: isNaN(sheetPx) ? null : sheetPx,
      priceFallback: isError,
      apyDiv:  toNum(c[11]) || 0,   // col L
      apyStk:  toNum(c[13]) || 0,   // col N
    };
  }).filter(Boolean);
  positions._fallbackCount = fallbackCount;
  return positions;
}

// ── Donut chart ───────────────────────────────────────────────────────────────
function buildDonut(positions) {
  const total = positions.reduce((s,p) => {
    const v = (p.currentPrice ?? p.avgPrice) * p.qty;
    return s + (isNaN(v) ? 0 : v);
  }, 0);
  if (!total) return '';

  const groups = {};
  positions.forEach(p => {
    const v = (p.currentPrice ?? p.avgPrice) * p.qty;
    if (!groups[p.type]) groups[p.type] = 0;
    groups[p.type] += isNaN(v) ? 0 : v;
  });

  const r=54, cx=72, cy=72, sw=18, circ=2*Math.PI*r, gap=2;
  const entries = Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  let accum=0, circles='', legendRows='';
  entries.forEach(([type, val]) => {
    const pct = val/total;
    const segLen = Math.max(0, pct*circ-gap);
    const color = COLORS[type]||COLORS.autre;
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${segLen} ${circ-segLen}" stroke-dashoffset="${circ/4-accum}" stroke-linecap="butt"/>`;
    accum += pct*circ;
    legendRows += `<div class="legend-row">
      <div class="legend-dot" style="background:${color}"></div>
      <div class="legend-name">${LABELS[type]||type}</div>
      <div class="legend-val">${fmtEur(val)}</div>
      <div class="legend-pct">${Math.round(pct*100)} %</div>
    </div>`;
  });

  return `<div class="pf-viz">
    <div class="donut-wrap">
      <svg class="donut-svg" viewBox="0 0 144 144">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>
        ${circles}
      </svg>
    </div>
    <div class="legend">${legendRows}</div>
  </div>`;
}

// ── Stats cards ───────────────────────────────────────────────────────────────
function buildStats(positions) {
  let investi=0, valeur=0, revDiv=0, revStk=0;
  positions.forEach(p => {
    const px = p.currentPrice ?? p.avgPrice;
    const i = p.avgPrice * p.qty;
    const v = px * p.qty;
    if (!isNaN(i)) investi += i;
    if (!isNaN(v)) { valeur += v; revDiv += v * p.apyDiv; revStk += v * p.apyStk; }
  });
  const pnl = valeur - investi;
  const pnlPct = investi > 0 ? (pnl/investi)*100 : 0;
  const revTotal = revDiv + revStk;
  const cls = pnlClass(pnl);

  return `<div class="pf-stats">
    <div class="stat">
      <div class="stat-label">Investi</div>
      <div class="stat-value">${fmtEur(investi)}</div>
      <div class="stat-sub">prix de revient</div>
    </div>
    <div class="stat">
      <div class="stat-label">Valeur actuelle</div>
      <div class="stat-value">${fmtEur(valeur)}</div>
      <div class="stat-sub">dont ${positions.filter(p=>p.priceFallback).length > 0 ? `<span style="color:#f59e0b">${positions.filter(p=>p.priceFallback).length} au prix de revient</span>` : 'tous au cours live'}</div>
    </div>
    <div class="stat">
      <div class="stat-label">P&amp;L</div>
      <div class="stat-value ${cls}">${sign(pnl)}${fmtEur(pnl)}</div>
      <div class="stat-sub ${cls}">${sign(pnlPct)}${pnlPct.toFixed(2)} %</div>
    </div>
    <div class="stat">
      <div class="stat-label">Revenus annuels</div>
      <div class="stat-value c-pos">${fmtEur(revTotal)}</div>
      <div class="stat-sub">${fmtEur(revDiv)} div · ${fmtEur(revStk)} staking</div>
    </div>
  </div>`;
}

// ── Table ─────────────────────────────────────────────────────────────────────
function buildTable(positions) {
  const ACCOUNTS = ['DEFAULT','PEA'];
  let html = '<div class="pf-table-wrap">';

  ACCOUNTS.forEach(acc => {
    const subset = positions.filter(p => p.compte === acc);
    if (!subset.length) return;

    html += `<p class="pf-section-label" style="margin-top:28px">${acc === 'PEA' ? 'PEA — Plan d\'Épargne en Actions' : 'Compte Standard'}</p>
    <table>
      <thead><tr>
        <th>Actif</th>
        <th style="text-align:left">Type</th>
        <th>Qté</th>
        <th>Px moyen</th>
        <th>Px actuel</th>
        <th>Valeur</th>
        <th>P&amp;L €</th>
        <th>P&amp;L %</th>
        <th>APY</th>
        <th>Rev./an</th>
      </tr></thead>
      <tbody>`;

    subset.forEach(p => {
      const typeKey = p.type in COLORS ? p.type : 'autre';
      const px = p.currentPrice ?? p.avgPrice;
      const invested = p.avgPrice * p.qty;
      const current  = px * p.qty;
      const pnl      = current - invested;
      const pnlPct   = invested > 0 ? (pnl/invested)*100 : 0;
      const apyTotal = p.apyDiv + p.apyStk;
      const revAn    = current * apyTotal;

      const pxCell = p.currentPrice != null
        ? `<span class="price-live">${fmtEur(p.currentPrice)}</span>`
        : `<span class="price-na" title="Prix de revient utilisé (GOOGLEFINANCE indisponible)">${fmtEur(p.avgPrice)} ≈</span>`;

      const apyParts = [];
      if (p.apyDiv > 0) apyParts.push(`<span style="color:#22c55e">${(p.apyDiv*100).toFixed(2)}% div</span>`);
      if (p.apyStk > 0) apyParts.push(`<span style="color:#f59e0b">${(p.apyStk*100).toFixed(2)}% stk</span>`);

      html += `<tr>
        <td>
          <div class="asset-name">${p.nom}</div>
          <div class="asset-ticker">${p.ticker}</div>
        </td>
        <td style="text-align:left"><span class="type-badge type-${typeKey}">${LABELS[typeKey]}</span></td>
        <td>${fmtNum(p.qty)}</td>
        <td>${fmtEur(p.avgPrice)}</td>
        <td>${pxCell}</td>
        <td>${fmtEur(current)}</td>
        <td><span class="${pnlClass(pnl)}">${sign(pnl)}${fmtEur(pnl)}</span></td>
        <td><span class="${pnlClass(pnlPct)}">${sign(pnlPct)}${pnlPct.toFixed(1)} %</span></td>
        <td style="font-size:11px;line-height:1.6">${apyParts.join('<br>') || '<span style="color:var(--muted)">—</span>'}</td>
        <td>${apyTotal > 0 ? `<span class="c-pos">${fmtEur(revAn)}</span>` : '—'}</td>
      </tr>`;
    });

    html += '</tbody></table>';
  });

  html += '</div>';
  return html;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(positions) {
  const updated = new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
  const nb = positions.filter(p=>p.priceFallback).length;
  const notice = nb > 0
    ? `<div class="pf-notice" style="margin-bottom:0;margin-top:0;padding:10px 16px">
        ⚠ ${nb} actif${nb>1?'s':''} en cours de mise à jour dans Google Finance — prix de revient utilisé comme approximation.
       </div>`
    : '';
  document.getElementById('pf-root').innerHTML =
    buildStats(positions) +
    notice +
    buildDonut(positions) +
    buildTable(positions) +
    `<div class="pf-footer">
      <span>Mis à jour le ${updated}</span>
      <button class="pf-refresh" onclick="loadPortfolio()">↻ Actualiser</button>
    </div>`;
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadPortfolio() {
  const root = document.getElementById('pf-root');
  root.innerHTML = '<div class="pf-loading">Chargement du portefeuille…</div>';
  try {
    const url = SHEET_URL;
    const res = await fetch(url, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const csv = await res.text();
    const positions = parseCSV(csv);
    if (!positions.length) throw new Error('Aucune position trouvée.');
    render(positions);
  } catch(e) {
    root.innerHTML = `<div class="pf-error">
      Impossible de charger le portefeuille : ${e.message}<br>
      <small>Vérifie que le Google Sheet est partagé en lecture (ou publié sur le web).</small>
    </div>`;
  }
}

loadPortfolio();
</script>
