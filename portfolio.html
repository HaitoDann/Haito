<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>document.documentElement.dataset.theme=localStorage.getItem("ht-theme")||"dark";</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Haito</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230d0d0d'/><text x='16' y='23' font-size='18' font-family='system-ui' font-weight='800' fill='%23f0f0f0' text-anchor='middle'>H</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* ── Header ── */
  .pf-header  { padding: 56px 0 40px; border-bottom: 1px solid var(--border); }
  .pf-title   { font-family: var(--font-display); font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
  .pf-subtitle{ font-size: 13px; color: var(--muted); }

  /* ── Notice ── */
  .pf-notice { background: color-mix(in srgb,#f59e0b 10%,transparent); border: 1px solid color-mix(in srgb,#f59e0b 25%,transparent); border-radius: 10px; padding: 12px 16px; margin: 16px 0; font-size: 12px; color: var(--dim); }

  /* ── Stats (glassmorphism) ── */
  .pf-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; padding: 28px 0; border-bottom: 1px solid var(--border); }
  @media (max-width: 640px) { .pf-stats { grid-template-columns: 1fr 1fr; } }
  .stat {
    background: color-mix(in srgb, var(--surface) 75%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    border-radius: 14px; padding: 18px 20px;
    transition: border-color .2s, background .2s;
  }
  .stat.stat-pnl-pos {
    background: color-mix(in srgb, #22c55e 7%, var(--surface));
    border-color: color-mix(in srgb, #22c55e 28%, var(--border));
  }
  .stat.stat-pnl-neg {
    background: color-mix(in srgb, #ef4444 6%, var(--surface));
    border-color: color-mix(in srgb, #ef4444 22%, var(--border));
  }
  .stat-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .stat-value { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1; }
  .stat-sub   { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .c-pos { color: #22c55e; }
  .c-neg { color: #ef4444; }
  .c-neu { color: var(--dim); }

  /* ── Charts grid ── */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 28px 0; border-bottom: 1px solid var(--border); }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .chart-title { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
  .chart-inner { display: flex; align-items: center; gap: 20px; }
  .donut-svg   { width: 110px; height: 110px; flex-shrink: 0; overflow: visible; }
  .donut-legend{ display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 0; }
  .legend-row  { display: flex; align-items: center; gap: 8px; }
  .legend-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { font-size: 12px; color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-pct  { font-size: 11px; font-weight: 600; color: var(--text); }

  /* ── Bar chart ── */
  .bar-section { padding: 28px 0; border-bottom: 1px solid var(--border); }
  .bar-section-title { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
  .bar-row   { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .bar-label { font-size: 12px; color: var(--dim); width: 156px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 3px; transition: width .4s ease; }
  .bar-meta  { font-size: 11px; color: var(--muted); width: 90px; text-align: right; flex-shrink: 0; }

  /* ── Filter tabs ── */
  .pf-filter-bar { display: flex; align-items: center; gap: 6px; padding: 20px 0 4px; flex-wrap: wrap; }
  .filter-tab {
    background: none; border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 14px; font-size: 11px; font-weight: 500; color: var(--muted);
    cursor: pointer; font-family: var(--font); transition: all .15s;
  }
  .filter-tab:hover { border-color: var(--dim); color: var(--text); }
  .filter-tab.active { background: var(--text); border-color: var(--text); color: var(--bg); }

  /* ── Sections ── */
  .pf-section { padding: 28px 0; border-bottom: 1px solid var(--border); }
  .pf-section:last-of-type { border-bottom: none; }
  .section-head  { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .section-total { font-size: 13px; font-weight: 600; color: var(--text); margin-left: auto; }
  .section-pnl   { font-size: 11px; margin-left: 8px; }

  /* ── Table ── */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
  th {
    font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); padding: 0 10px 10px; text-align: right;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    user-select: none;
  }
  th:first-child { text-align: left; padding-left: 0; }
  th.sortable { cursor: pointer; transition: color .15s; }
  th.sortable:hover { color: var(--text); }
  th.sort-active { color: var(--text); }
  .sort-ind { font-size: 9px; margin-left: 3px; opacity: .9; }
  .sort-hint{ font-size: 9px; margin-left: 3px; opacity: .3; }
  td { padding: 13px 10px; border-bottom: 1px solid var(--border); color: var(--dim); text-align: right; vertical-align: middle; }
  td:first-child { text-align: left; padding-left: 0; }
  tr:last-child td { border-bottom: none; }

  /* ── Asset cell ── */
  .asset-row { display: flex; align-items: center; gap: 10px; }
  .asset-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 0%, transparent); }
  .asset-name   { font-weight: 600; color: var(--text); font-size: 13.5px; }
  .asset-ticker { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: monospace; }
  .manual-badge { font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 2px 5px; border-radius: 3px; background: color-mix(in srgb,#a78bfa 15%,transparent); color: #a78bfa; margin-left: 6px; vertical-align: middle; }
  .price-live { color: var(--text); }
  .price-na   { color: var(--muted); font-style: italic; }
  .apy-cell   { font-size: 11px; line-height: 1.7; }
  .stk-tokens { font-size: 10px; color: #f59e0b; margin-top: 2px; text-align: right; white-space: nowrap; }

  /* ── Animations ── */
  @keyframes rowEnter {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  tbody tr {
    animation: rowEnter 0.32s ease-out both;
    animation-delay: calc(var(--row-i, 0) * 38ms);
  }

  @keyframes pricePulse {
    0%   { color: #f59e0b; text-shadow: 0 0 8px rgba(245,158,11,.5); }
    100% { color: var(--text); text-shadow: none; }
  }
  .price-pulse { animation: pricePulse 1.2s ease-out forwards !important; }

  @keyframes liveBlink {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,.4); }
    50%       { opacity: .5; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
  }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e; margin-right: 7px; vertical-align: middle;
    animation: liveBlink 2.2s ease-in-out infinite;
  }

  /* ── Footer ── */
  .pf-footer  { display: flex; align-items: center; justify-content: space-between; padding: 24px 0 48px; font-size: 11px; color: var(--muted); }
  .pf-refresh { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; font-size: 11px; color: var(--dim); cursor: pointer; font-family: var(--font); transition: border-color .15s, color .15s; }
  .pf-refresh:hover { border-color: var(--text); color: var(--text); }

  .pf-loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 14px; }
  .pf-error   { color: #ef4444; font-size: 13px; padding: 32px 0; }

  @media (max-width: 760px) {
    .pf-stats    { grid-template-columns: 1fr 1fr; }
    .charts-grid { grid-template-columns: 1fr; }
    .chart-inner { flex-direction: row; }
  }
  @media (max-width: 480px) { .bar-label { width: 100px; } }

  /* ── Chart interactions : bar ── */
  .bar-row[data-ticker] { cursor: pointer; transition: opacity .18s; }
  .bar-row.bar-dimmed   { opacity: 0.2; }
  .bar-row.bar-focused .bar-track  { height: 9px; }
  .bar-row.bar-focused .bar-label  { color: var(--text); font-weight: 600; white-space: normal; overflow: visible; text-overflow: unset; }
  .bar-row.bar-focused .bar-meta   { color: var(--text); font-weight: 600; }
  .bar-track { transition: height .15s; }

  /* ── Chart interactions : donut ── */
  .donut-arc  { cursor: pointer; transition: opacity .2s, stroke-width .2s; }
  .legend-row { cursor: pointer; transition: opacity .18s; }
  .donut-center-label, .donut-center-pct { opacity: 0; pointer-events: none; transition: opacity .18s; }

  /* ── Tooltip flottant ── */
  .pf-tooltip {
    position: fixed; z-index: 150; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,.30);
    min-width: 170px; max-width: 230px; font-size: 12px;
  }

  /* ── Table row hover avec couleur de marque ── */
  td:first-child { border-left: 3px solid transparent; transition: border-color .15s; }
  tbody tr:hover { background: color-mix(in srgb, var(--row-color, var(--border)) 5%, transparent); }
  tbody tr:hover td:first-child { border-left-color: var(--row-color, var(--dim)); }
  tbody tr:hover .asset-dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--row-color) 28%, transparent); }

  /* ── Barre de recherche ── */
  .pf-search {
    margin-left: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 14px; font-size: 11px; color: var(--text); font-family: var(--font);
    transition: border-color .15s, width .2s; outline: none; width: 150px;
  }
  .pf-search:focus { border-color: #a78bfa; width: 200px; }
  .pf-search::placeholder { color: var(--muted); }

  /* ── Modal ── */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-backdrop[hidden] { display: none!important; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
  .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row { margin-bottom: 16px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-row label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .form-row input, .form-row select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text); font-family: var(--font); box-sizing: border-box; transition: border-color .15s; }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: #a78bfa; }
  .form-row select option { background: var(--surface); }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-primary { flex: 1; background: #a78bfa; border: none; border-radius: 8px; padding: 11px; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; font-family: var(--font); transition: opacity .15s; }
  .btn-primary:hover { opacity: .85; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-cancel { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 11px 20px; font-size: 13px; color: var(--dim); cursor: pointer; font-family: var(--font); transition: border-color .15s, color .15s; }
  .btn-cancel:hover { border-color: var(--text); color: var(--text); }
  .form-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── FAB ── */
  .fab { position: fixed; bottom: 28px; right: 28px; width: 52px; height: 52px; border-radius: 50%; background: #a78bfa; border: none; color: #fff; font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 4px 16px rgba(167,139,250,.4); display: flex; align-items: center; justify-content: center; z-index: 100; transition: transform .15s, box-shadow .15s; }
  .fab:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(167,139,250,.5); }

  /* ── Toast ── */
  .pf-toast { position: fixed; bottom: 96px; right: 28px; font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: 8px; z-index: 300; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; max-width: 320px; }
  .pf-toast.show { opacity: 1; transform: translateY(0); }
  .pf-toast.ok  { background: #22c55e; color: #fff; }
  .pf-toast.err { background: #ef4444; color: #fff; }

  /* ── View navigation ── */
  .pf-view-nav { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 0; overflow-x: auto; }
  .view-tab { background: none; border: none; border-bottom: 3px solid transparent; padding: 14px 22px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; font-family: var(--font); transition: color .15s, border-color .15s; margin-bottom: -2px; white-space: nowrap; }
  .view-tab:hover { color: var(--text); }
  .view-tab.active { color: #a78bfa; border-bottom-color: #a78bfa; font-weight: 600; }

  /* ── Répartition view ── */
  .rep-wrap { padding: 28px 0; }
  .rep-chart-inner { align-items: flex-start !important; gap: 32px !important; }
  .rep-legend-extra { font-size: 11px; color: var(--muted); min-width: 72px; text-align: right; }

  /* ── Projection view ── */
  .proj-container { padding: 28px 0; }
  .proj-inputs { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 760px) { .proj-inputs { grid-template-columns: 1fr 1fr; } }
  .proj-input-group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .proj-input-label { display: block; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .proj-input-field { width: 100%; background: none; border: none; font-size: 20px; font-weight: 700; font-family: var(--font-display); color: var(--text); outline: none; padding: 0; }
  .proj-input-field::-webkit-inner-spin-button, .proj-input-field::-webkit-outer-spin-button { -webkit-appearance: none; }
  .proj-chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
  .proj-chart-svg { width: 100%; display: block; }
  .proj-hover-label { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; position: absolute; font-size: 11px; pointer-events: none; min-width: 140px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .proj-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 16px; }
  @media (max-width: 480px) { .proj-summary { grid-template-columns: 1fr; } }
  .proj-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .proj-stat-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .proj-stat-value { font-size: 20px; font-weight: 700; font-family: var(--font-display); }
</style>
</head>

<nav class="ht-nav">
  <div class="ht-nav-inner">
    <a class="ht-brand" href="index.html">Haito</a>
    <ul class="ht-nav-links">
      <li><a href="nilo.html">Nilo</a></li>
      <li><a href="vinx.html">VinX Ledger</a></li>
      <li><a href="plazma.html">PlaZma</a></li>
      <li><a href="archi.html">ARCHI</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="Changer le thème"></button>
  </div>
</nav>

<div class="wrap">
  <header class="pf-header">
    <div class="pf-title">Portfolio</div>
    <div class="pf-subtitle">Épargne · Actions · Crypto · ETF</div>
  </header>
  <div id="pf-root"><div class="pf-loading">Chargement…</div></div>
</div>

<button class="fab" id="fabBtn" title="Ajouter une position" onclick="openAddModal()">+</button>

<div class="modal-backdrop" id="addModal" hidden>
  <div class="modal">
    <div class="modal-title">Ajouter une position</div>
    <div class="modal-sub">La position sera ajoutée directement dans ton Google Sheet.</div>
    <div class="form-grid2">
      <div class="form-row">
        <label>Compte</label>
        <select id="f-compte">
          <option value="DEFAULT">CTO (Compte-Titres Ordinaire)</option>
          <option value="PEA">PEA</option>
        </select>
      </div>
      <div class="form-row">
        <label>Classe</label>
        <select id="f-classe">
          <option value="Crypto">Crypto</option>
          <option value="Action">Action</option>
          <option value="ETF">ETF</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>Nom complet</label>
      <input type="text" id="f-nom" placeholder="ex : Bitcoin, Realty Income, Nvidea…">
    </div>
    <div class="form-row">
      <label>Ticker / ISIN</label>
      <input type="text" id="f-ticker" placeholder="ex : BTC · NYSE:O · FR0000120578 · NVDA">
      <div class="form-hint">Utilisé pour la formule de prix dans le Sheet.</div>
    </div>
    <div class="form-row">
      <label>Type de prix (formule Google Sheets)</label>
      <select id="f-priceType">
        <option value="gf_eur">GOOGLEFINANCE — Action en EUR (Euronext…)</option>
        <option value="gf_usd">GOOGLEFINANCE — Action en USD → EUR (NYSE, NASDAQ…)</option>
        <option value="gf_gbp">GOOGLEFINANCE — Action LSE en GBX → EUR</option>
        <option value="gf_crypto">GOOGLEFINANCE — Crypto vs EUR (BTC, ETH, XRP…)</option>
        <option value="cc">CryptoCompare — Altcoin (SOL, ADA, DOT, TAO…)</option>
        <option value="fixed">Prix fixe (manuel — pas de mise à jour auto)</option>
      </select>
    </div>
    <div class="form-grid2">
      <div class="form-row">
        <label>Quantité</label>
        <input type="number" id="f-qty" step="any" min="0" placeholder="0">
      </div>
      <div class="form-row">
        <label>Prix moyen (€)</label>
        <input type="number" id="f-avg" step="any" min="0" placeholder="0.00">
      </div>
    </div>
    <div class="form-grid2">
      <div class="form-row">
        <label>APY dividende (%)</label>
        <input type="number" id="f-apyDiv" step="any" min="0" placeholder="0">
      </div>
      <div class="form-row">
        <label>APY staking (%)</label>
        <input type="number" id="f-apyStk" step="any" min="0" placeholder="0">
      </div>
    </div>
    <div class="form-row">
      <label>Notes (optionnel)</label>
      <input type="text" id="f-notes" placeholder="">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Annuler</button>
      <button class="btn-primary" id="f-submit" onclick="submitPosition()">Ajouter dans le Sheet</button>
    </div>
  </div>
</div>

<div class="pf-toast" id="pfToast"></div>
<div class="pf-tooltip" id="pf-tooltip" hidden></div>

<script src="assets/haito.js"></script>
<script>
// ════════════════════════════════════════════════════════════════
//  CONFIGURATION
// ════════════════════════════════════════════════════════════════

const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4SekTzISvavuM7C_R1uAejYVlUz3xy2_X0ssVp9xQ_UsiYG5WbjATDIlKRU52cYE_rTw4asJpa2Yn/pub?output=csv';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxCkmxrVuAEyRgYVQYN488bejLAQ_dME2zDspdkdxERSLylZI1Bewv4BXoiW9FZ9OpP/exec';
const MANUAL = [];

const REALIZED_GAINS = 2560;

const STAKING_TOKENS = {
  TAO:   7.1096,
  MATIC: 2.0000,
  ETH:   0.08,
  SOL:   7.50,
  DOT:   0.43,

function assetColor(p) {
  return ASSET_COLORS[p.ticker] ||
    (p.type==='crypto' ? '#f59e0b' : p.compte==='PEA' ? '#0ea5e9' : '#22c55e');
}

function fmtEur(n, dec=2) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtNum(n, dec=4) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:dec});
}
function sign(n)      { return n >= 0 ? '+' : ''; }
function pnlClass(n)  { return n > 0 ? 'c-pos' : n < 0 ? 'c-neg' : 'c-neu'; }
function toNum(s) {
  if (s == null) return NaN;
  return parseFloat(String(s).replace(/\s/g,'').replace(',','.'));
}
function mapType(c) {
  const v = (c||'').toLowerCase().trim();
  return v==='crypto'?'crypto': v==='action'?'action': v==='etf'?'etf': 'autre';
}

// Compte animé 0→target en durée ms
function animateCounter(el, target, duration=1100) {
  const start = performance.now();
  const isNeg = target < 0;
  const abs   = Math.abs(target);
  function step(now) {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    const val = (isNeg ? -1 : 1) * abs * ease;
    el.textContent = fmtEur(val, 0);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = fmtEur(target, 0);
  }
  requestAnimationFrame(step);
}

// ════════════════════════════════════════════════════════════════
//  CSV PARSER
// ════════════════════════════════════════════════════════════════

function parseLine(line) {
  const cols=[]; let cur='', inq=false;
  for (let i=0;i<line.length;i++) {
    const c=line[i];
    if(c==='"'){if(inq&&line[i+1]==='"'){cur+='"';i++;}else inq=!inq;continue;}
    if(c===','&&!inq){cols.push(cur.trim());cur='';continue;}
    cur+=c;
  }
  cols.push(cur.trim()); return cols;
}

function parseCSV(text) {
  const lines = text.replace(/\r/g,'').trim().split('\n');
  return lines.slice(1).map(line => {
    const c = parseLine(line);
    const qty = toNum(c[4]), avg = toNum(c[5]);
    if (!c[2] || isNaN(qty) || qty <= 0) return null;
    const raw = (c[6]||'').trim();
    const isErr = !raw || raw.startsWith('#') || raw==='Erreur';
    const sheetPx = isErr ? NaN : toNum(raw);
    return {
      compte:       (c[0]||'DEFAULT').trim(),
      type:         mapType(c[1]),
      nom:          (c[2]||'').trim(),
      ticker:       (c[3]||'').trim(),
      qty, avgPrice: isNaN(avg)?0:avg,
      currentPrice: isNaN(sheetPx)?null:sheetPx,
      priceFallback: isErr,
      apyDiv: toNum(c[11])||0,
      apyStk: toNum(c[13])||0,
      notes:        (c[15]||'').trim(),
      qtyBought:    toNum(c[16]) >= 0 && !isNaN(toNum(c[16])) ? toNum(c[16]) : qty,
      manual: false,
    };
  }).filter(Boolean);
}

// ── Fetch CoinGecko (positions manuelles) ───────────────────────
async function fetchManualPrices(manual) {
  const cryptos = manual.filter(p => p.type==='crypto' && p.cgId && p.qty>0);
  if (!cryptos.length) return;
  try {
    const ids = cryptos.map(p=>p.cgId).join(',');
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=eur`,{signal:AbortSignal.timeout(8000)});
    if (!res.ok) return;
    const data = await res.json();
    cryptos.forEach(p=>{ if(data[p.cgId]) p.currentPrice=data[p.cgId].eur; });
  } catch(e) { console.warn('CoinGecko:', e.message); }
}

// ════════════════════════════════════════════════════════════════
//  SORT
// ════════════════════════════════════════════════════════════════

function valOf(p)  { return (p.currentPrice??p.avgPrice)*p.qty; }
function pnlOf(p)  { return valOf(p) - p.avgPrice*p.qty; }
function pnlPOf(p) { const i=p.avgPrice*p.qty; return i>0?pnlOf(p)/i:0; }
function revOf(p)  { return valOf(p)*(p.apyDiv+p.apyStk); }

function filterBySearch(arr) {
  if (!_searchQuery) return arr;
  const q = _searchQuery;
  return arr.filter(p => p.nom.toLowerCase().includes(q) || p.ticker.toLowerCase().includes(q));
}

function sortPositions(arr) {
  return [...arr].sort((a,b) => {
    let va, vb;
    switch(_sortCol) {
      case 'nom':    return _sortDir * a.nom.localeCompare(b.nom,'fr');
      case 'pnl':    va=pnlOf(a);  vb=pnlOf(b);  break;
      case 'pnlpct': va=pnlPOf(a); vb=pnlPOf(b); break;
      case 'apy':    va=a.apyDiv+a.apyStk; vb=b.apyDiv+b.apyStk; break;
      case 'rev':    va=revOf(a);  vb=revOf(b);   break;
      default:       va=valOf(a);  vb=valOf(b);
    }
    return _sortDir * (va - vb);
  });
}

function mkDonut(entries, donutId='d') {
  const total = entries.reduce((s,e)=>s+e.value,0);
  if (!total) return '';
  const r=46,cx=55,cy=55,sw=16,circ=2*Math.PI*r,gap=2;
  let accum=0, circles='', rows='';
  entries.filter(e=>e.value>0).sort((a,b)=>b.value-a.value).forEach((e,idx)=>{
    const pct=e.value/total;
    const segLen=Math.max(0,pct*circ-gap);
    const pctStr=Math.round(pct*100)+'%';
    const safeLabel=e.label.replace(/"/g,'&quot;');
    circles+=`<circle class="donut-arc" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.color}" stroke-width="${sw}" stroke-dasharray="${segLen} ${circ-segLen}" stroke-dashoffset="${circ/4-accum}" stroke-linecap="butt" data-idx="${idx}" data-label="${safeLabel}" data-pct="${pctStr}" data-color="${e.color}"/>`;
    accum+=pct*circ;
    rows+=`<div class="legend-row" data-idx="${idx}">
      <div class="legend-dot" style="background:${e.color}"></div>
      <div class="legend-name">${e.label}</div>
      <div class="legend-pct">${Math.round(pct*100)} %</div>
    </div>`;
  });
  return `<div class="chart-inner" data-donut="${donutId}">
    <svg class="donut-svg" viewBox="0 0 110 110" data-donut="${donutId}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>
      ${circles}
      <text class="donut-center-label" x="${cx}" y="${cy-7}" text-anchor="middle" font-size="8" fill="var(--muted)" opacity="0"></text>
      <text class="donut-center-pct"   x="${cx}" y="${cy+8}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)" opacity="0"></text>
    </svg>
    <div class="donut-legend" data-donut="${donutId}">${rows}</div>
  </div>`;
}

function buildCharts(positions) {
  // Donut 1 — par type
  const byType = {
    'Crypto':      positions.filter(p=>p.type==='crypto').reduce((s,p)=>s+valOf(p),0),
    'Actions CTO': positions.filter(p=>p.type!=='crypto'&&p.compte==='DEFAULT').reduce((s,p)=>s+valOf(p),0),
    'Actions PEA': positions.filter(p=>p.compte==='PEA').reduce((s,p)=>s+valOf(p),0),
  };
  const d1 = Object.entries(byType).map(([label,value])=>({label,value,color:COLORS[label]||'#888'}));

  // Donut 2 — CTO vs PEA
  const byCompte = {
    'CTO': positions.filter(p=>p.compte==='DEFAULT').reduce((s,p)=>s+valOf(p),0),
    'PEA': positions.filter(p=>p.compte==='PEA').reduce((s,p)=>s+valOf(p),0),
  };
  const d2 = Object.entries(byCompte).map(([label,value])=>({label,value,color:COLORS[label]||'#888'}));

  // Donut 3 — crypto par actif (couleurs de marque)
  const cryptos = positions.filter(p=>p.type==='crypto');
  const d3 = cryptos.map(p=>({label:p.nom, value:valOf(p), color:assetColor(p)}));

  // Bar chart — part de chaque actif (couleur de marque)
  const total = positions.reduce((s,p)=>s+valOf(p),0);
  const sorted = [...positions].map(p=>({...p,_val:valOf(p)})).filter(p=>p._val>0).sort((a,b)=>b._val-a._val);
  const bars = sorted.map(p=>{
    const pnl = p._val - p.avgPrice*p.qty;
    const pnlCls = pnl>0?'c-pos':pnl<0?'c-neg':'c-neu';
    const safeNom = p.nom.replace(/"/g,'&quot;');
    const color = assetColor(p);
    return `<div class="bar-row"
      data-ticker="${p.ticker}" data-nom="${safeNom}" data-color="${color}"
      data-val="${fmtEur(p._val,0)}" data-pct="${Math.round(p._val/total*100)} %"
      data-pnl="${sign(pnl)}${fmtEur(pnl,0)}" data-pnlcls="${pnlCls}">
      <div class="bar-label" title="${p.nom}">
        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle;flex-shrink:0"></span>${p.nom}
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${((p._val/total)*100).toFixed(2)}%;background:${color}"></div></div>
      <div class="bar-meta">${fmtEur(p._val,0)} · ${Math.round(p._val/total*100)} %</div>
    </div>`;
  }).join('');

  return `
  <div class="charts-grid">
    <div class="chart-card"><div class="chart-title">Répartition par type</div>${mkDonut(d1,'d1')}</div>
    <div class="chart-card"><div class="chart-title">CTO vs PEA</div>${mkDonut(d2,'d2')}</div>
    <div class="chart-card"><div class="chart-title">Crypto — par actif</div>${mkDonut(d3,'d3')}</div>
  </div>
  <div class="bar-section">
    <div class="bar-section-title">Part de chaque actif dans le capital total</div>
    ${bars}
  </div>`;
}

function buildStats(positions) {
  let investi=0, valeur=0, revDiv=0, revStk=0, stakingVal=0;
  positions.forEach(p=>{
    const px=p.currentPrice??p.avgPrice;
    investi += p.avgPrice*p.qty;
    valeur  += px*p.qty;
    revDiv  += p.avgPrice*p.qty*p.apyDiv;
    revStk  += px*p.qty*p.apyStk;
    stakingVal += (STAKING_TOKENS[p.ticker]||0)*px;
  });
  const cashIn = investi - REALIZED_GAINS;
  const unrealized = valeur - investi;
  const totalPnl = unrealized + REALIZED_GAINS;
  const totalPnlPct = cashIn > 0 ? (totalPnl/cashIn)*100 : 0;
  const nbFallback = positions.filter(p=>p.priceFallback).length;
  const hasPV = REALIZED_GAINS > 0;
  const hasStk = stakingVal > 0;
  const pnlCardClass = totalPnl > 0 ? 'stat-pnl-pos' : totalPnl < 0 ? 'stat-pnl-neg' : '';

  const displayCash = hasPV ? cashIn : investi;

  return `<div class="pf-stats">
    <div class="stat">
      <div class="stat-label">${hasPV?'Cash engagé':'Investi'}</div>
      <div class="stat-value" data-count-target="${displayCash}">${fmtEur(displayCash,0)}</div>
      <div class="stat-sub">${hasPV?`coût de revient : ${fmtEur(investi,0)}`:'prix de revient total'}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Valeur actuelle</div>
      <div class="stat-value" data-count-target="${valeur}">${fmtEur(valeur,0)}</div>
      <div class="stat-sub">${nbFallback>0?`<span style="color:#f59e0b">${nbFallback} prix en attente</span>`:'tous au cours live'}</div>
    </div>
    <div class="stat ${pnlCardClass}">
      <div class="stat-label">P&amp;L total</div>
      <div class="stat-value ${pnlClass(totalPnl)}" data-count-target="${totalPnl}">${sign(totalPnl)}${fmtEur(totalPnl,0)}</div>
      <div class="stat-sub ${pnlClass(totalPnlPct)}">${sign(totalPnlPct)}${totalPnlPct.toFixed(2)} %${hasPV?`<br><span style="font-size:10px;opacity:.7">dont ${fmtEur(REALIZED_GAINS,0)} PV réalisées</span>`:''}${hasStk?`<br><span style="font-size:10px;color:#f59e0b">⚡ ~${fmtEur(stakingVal,0)} tokens staking</span>`:''}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Revenus annuels</div>
      <div class="stat-value c-pos" data-count-target="${revDiv+revStk}">${fmtEur(revDiv+revStk,0)}</div>
      <div class="stat-sub">${fmtEur(revDiv,0)} div · ${fmtEur(revStk,0)} stk</div>
    </div>
  </div>`;
}

function sortIcon(col) {
  if (_sortCol !== col) return `<span class="sort-hint">↕</span>`;
  return `<span class="sort-ind">${_sortDir === -1 ? '↓' : '↑'}</span>`;
}

function buildTable(subset) {
  if (!subset.length) return '<p style="color:var(--muted);font-size:13px">Aucune position.</p>';
  const sc = col => _sortCol===col ? 'sortable sort-active' : 'sortable';
  return `<div class="tbl-wrap"><table>
    <thead><tr>
      <th class="${sc('nom')}" data-sort-col="nom">Actif${sortIcon('nom')}</th>
      <th>Qté</th>
      <th>Px moyen</th>
      <th>Px actuel</th>
      <th class="${sc('val')}" data-sort-col="val">Valeur${sortIcon('val')}</th>
      <th class="${sc('pnl')}" data-sort-col="pnl">P&amp;L €${sortIcon('pnl')}</th>
      <th class="${sc('pnlpct')}" data-sort-col="pnlpct">P&amp;L %${sortIcon('pnlpct')}</th>
      <th class="${sc('apy')}" data-sort-col="apy">APY${sortIcon('apy')}</th>
      <th class="${sc('rev')}" data-sort-col="rev">Rev./an${sortIcon('rev')}</th>
    </tr></thead>
    <tbody>
    ${subset.map((p,i)=>{
      const px  = p.currentPrice ?? p.avgPrice;
      const inv = p.avgPrice * p.qty;
      const val = px * p.qty;
      const pnl = val - inv;
      const pnlPct = inv > 0 ? (pnl/inv)*100 : (val>0?100:0);
      const apyT = p.apyDiv + p.apyStk;
      const color = assetColor(p);

      const qtyStk = (p.qtyBought !== undefined && p.qtyBought < p.qty - 0.0001) ? p.qty - p.qtyBought : 0;
      const qtyCell = qtyStk > 0
        ? `${fmtNum(p.qty)}<div class="stk-tokens">⚡ ${fmtNum(qtyStk,3)} staking</div>`
        : fmtNum(p.qty);

      const pxCell = p.currentPrice != null
        ? `<span class="price-live">${fmtEur(p.currentPrice)}</span>`
        : `<span class="price-na" title="Fallback prix moyen">${fmtEur(p.avgPrice)} ≈</span>`;

      const apyParts = [];
      if (p.apyDiv>0) apyParts.push(`<span class="c-pos">${(p.apyDiv*100).toFixed(2)}% div</span>`);
      if (p.apyStk>0) apyParts.push(`<span style="color:#f59e0b">${(p.apyStk*100).toFixed(2)}% stk</span>`);

      return `<tr style="--row-i:${i};--row-color:${color}" data-ticker="${p.ticker}">
        <td>
          <div class="asset-row">
            <span class="asset-dot" style="background:${color}"></span>
            <div>
              <div class="asset-name">${p.nom}${p.manual?'<span class="manual-badge">MANUEL</span>':''}</div>
              <div class="asset-ticker">${p.ticker}${p.notes?`<span style="color:var(--muted);font-weight:400;margin-left:6px">${p.notes}</span>`:''}</div>
            </div>
          </div>
        </td>
        <td>${qtyCell}</td>
        <td>${fmtEur(p.avgPrice)}<div style="font-size:10px;color:var(--muted);margin-top:2px">sur coût effectif</div></td>
        <td>${pxCell}</td>
        <td>${fmtEur(val)}</td>
        <td><span class="${pnlClass(pnl)}">${sign(pnl)}${fmtEur(pnl)}</span></td>
        <td><span class="${pnlClass(pnlPct)}">${sign(pnlPct)}${pnlPct.toFixed(1)} %</span></td>
        <td class="apy-cell">${apyParts.join('<br>')||'<span style="color:var(--muted)">—</span>'}</td>
        <td>${apyT>0?`<span class="c-pos">${fmtEur(val*apyT)}</span>`:'—'}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

function buildSection(positions, label, filterFn) {
  const subset = sortPositions(filterBySearch(positions.filter(filterFn)));
  const total  = subset.reduce((s,p)=>s+valOf(p),0);
  const inv    = subset.reduce((s,p)=>s+p.avgPrice*p.qty,0);
  const pnl    = total-inv;
  return `<div class="pf-section">
    <div class="section-head">
      <span class="section-label">${label}</span>
      <span class="section-total">${fmtEur(total,0)}</span>
      <span class="section-pnl ${pnlClass(pnl)}">${sign(pnl)}${fmtEur(pnl,0)}</span>
    </div>
    ${buildTable(subset)}
  </div>`;
}

function buildFilterBar() {
  const tabs = [
    {f:'all',   label:'Tout'},
    {f:'crypto',label:'Crypto'},
    {f:'cto',   label:'Actions CTO'},
    {f:'pea',   label:'Actions PEA'},

  return tabs.map(t=>`<button class="filter-tab${_filterActive===t.f?' active':''}" data-filter="${t.f}">${t.label}</button>`).join('') +
    `<input class="pf-search" id="pf-search-input" type="text" placeholder="🔍 Rechercher…" value="${_searchQuery.replace(/"/g,'&quot;')}" autocomplete="off">`;

function buildSections(positions) {
  if (_filterActive === 'all') {
    return buildSection(positions, 'Crypto',       p=>p.type==='crypto') +
           buildSection(positions, 'Actions — CTO',p=>p.type!=='crypto'&&p.compte==='DEFAULT') +
           buildSection(positions, 'Actions — PEA',p=>p.compte==='PEA');
  }
  const map = {
    crypto: {fn:p=>p.type==='crypto',                           label:'Crypto'},
    cto:    {fn:p=>p.type!=='crypto'&&p.compte==='DEFAULT',     label:'Actions — CTO'},
    pea:    {fn:p=>p.compte==='PEA',                            label:'Actions — PEA'},
  };
  const {fn,label} = map[_filterActive];
  return buildSection(positions, label, fn);
}

// ── Donut grand format (répartition globale) ────────────────────
function mkRepDonut(entries, donutId='rep') {
  const total = entries.reduce((s,e)=>s+e.value,0);
  if (!total) return '';
  const r=80, cx=100, cy=100, sw=20, circ=2*Math.PI*r, gap=1.5;
  let accum=0, circles='', rows='';
  entries.filter(e=>e.value>0).forEach((e,idx)=>{
    const pct=e.value/total;
    const segLen=Math.max(0,pct*circ-gap);
    const pctStr=Math.round(pct*100)+'%';
    const safeLabel=e.label.replace(/"/g,'&quot;');
    circles+=`<circle class="donut-arc" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.color}" stroke-width="${sw}" stroke-dasharray="${segLen} ${circ-segLen}" stroke-dashoffset="${circ/4-accum}" stroke-linecap="butt" data-idx="${idx}" data-label="${safeLabel}" data-pct="${pctStr}" data-color="${e.color}"/>`;
    accum+=pct*circ;
    rows+=`<div class="legend-row" data-idx="${idx}" style="padding:5px 0">
      <div class="legend-dot" style="background:${e.color}"></div>
      <div class="legend-name">${e.label}${e.ticker?`<span style="font-size:9px;color:var(--muted);font-family:monospace;margin-left:5px">${e.ticker}</span>`:''}</div>
      <div class="legend-pct">${Math.round(pct*100)} %</div>
      <div class="rep-legend-extra">${fmtEur(e.value,0)}</div>
    </div>`;
  });
  return `<div class="chart-inner rep-chart-inner" data-donut="${donutId}">
    <svg class="donut-svg" viewBox="0 0 200 200" data-donut="${donutId}" style="width:180px;height:180px">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>
      ${circles}
      <text class="donut-center-label" x="${cx}" y="${cy-12}" text-anchor="middle" font-size="11" fill="var(--muted)" opacity="0"></text>

    </svg>

  </div>`;
}

function buildViewNav() {

}

function buildCurrentView(positions) {
  switch (_currentView) {
    case 'portfolio':   return buildViewPortfolio(positions);
    case 'repartition': return buildViewRepartition(positions);
    case 'projection':  return buildViewProjection(positions);
    default:            return buildViewDashboard(positions);
  }
}

function buildViewDashboard(positions) {
  const nbFallback = positions.filter(p=>p.priceFallback).length;
  const notice = nbFallback>0
    ? `<div class="pf-notice">⚠ ${nbFallback} actif${nbFallback>1?'s':''} avec GOOGLEFINANCE indisponible — prix de revient affiché comme approximation (≈).</div>`
    : '';
  return `${buildStats(positions)}${notice}${buildCharts(positions)}`;
}

function buildViewPortfolio(positions) {
  const nbFallback = positions.filter(p=>p.priceFallback).length;
  const notice = nbFallback>0
    ? `<div class="pf-notice">⚠ ${nbFallback} actif${nbFallback>1?'s':''} avec GOOGLEFINANCE indisponible — prix de revient affiché comme approximation (≈).</div>`
    : '';
  return `${notice}<div class="pf-filter-bar" id="pf-filter-bar">${buildFilterBar()}</div><div id="pf-sections">${buildSections(positions)}</div>`;
}

function buildViewRepartition(positions) {
  const entries = [...positions]
    .map(p=>({label:p.nom, ticker:p.ticker, value:valOf(p), color:assetColor(p)}))
    .filter(e=>e.value>0).sort((a,b)=>b.value-a.value);
  const total = entries.reduce((s,e)=>s+e.value,0);
  return `<div class="rep-wrap">
    <div class="chart-title" style="margin-bottom:20px">Répartition globale — tous actifs</div>
    ${mkRepDonut(entries,'rep')}
    <div style="margin-top:14px;font-size:12px;color:var(--muted)">Total : <strong style="color:var(--text)">${fmtEur(total,0)}</strong></div>
  </div>`;
}

// ── Projection : intérêts composés ──────────────────────────────
function calcProjection(v0, monthly, rate, years) {
  const rm = rate/12;
  return Array.from({length:years+1}, (_,y) => {
    const t = y*12;
    const val = rm>0 ? v0*Math.pow(1+rm,t)+monthly*(Math.pow(1+rm,t)-1)/rm : v0+monthly*t;
    return {y, val, noY: v0+monthly*12*y};
  });
}

function buildProjectionChart(v0, monthly, rate, years) {
  const pts = calcProjection(v0, monthly, rate, years);
  const maxVal = Math.max(...pts.map(p=>p.val), 1);
  const W=600, H=260, PL=86, PR=16, PT=16, PB=36;
  const cW=W-PL-PR, cH=H-PT-PB;
  const sx=y=>PL+(y/years)*cW, sy=v=>PT+cH-(v/maxVal)*cH;

  let grid='', xlbls='';
  for (let i=1;i<=4;i++) {
    const v=maxVal*i/4, gy=sy(v).toFixed(1);
    grid+=`<line x1="${PL}" y1="${gy}" x2="${W-PR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>
<text x="${PL-7}" y="${(parseFloat(gy)+4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtEur(v,0)}</text>`;
  }
  const step=years<=10?2:years<=20?5:10;
  for(let y=0;y<=years;y+=step){
    xlbls+=`<text x="${sx(y).toFixed(1)}" y="${H-PB+13}" text-anchor="middle" font-size="9" fill="var(--muted)">${y}a</text>`;
  }

  const line1=pts.map(p=>`${sx(p.y).toFixed(1)},${sy(p.val).toFixed(1)}`).join(' ');
  const line2=pts.map(p=>`${sx(p.y).toFixed(1)},${sy(p.noY).toFixed(1)}`).join(' ');
  const poly=`${PL},${H-PB} ${line1} ${W-PR},${H-PB}`;

  return `<svg class="proj-chart-svg" viewBox="0 0 ${W} ${H}" id="proj-svg">
  <defs>
    <linearGradient id="proj-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  ${grid}
  <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="var(--border)" stroke-width="1.5"/>
  ${xlbls}
  <polyline fill="none" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.4" points="${line2}" stroke-linejoin="round"/>
  <polygon fill="url(#proj-grad)" stroke="none" points="${poly}"/>
  <polyline fill="none" stroke="#a78bfa" stroke-width="2.5" points="${line1}" stroke-linejoin="round"/>
  <line id="proj-vline" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" visibility="hidden"/>
  <circle id="proj-dot" cx="0" cy="0" r="5" fill="#a78bfa" stroke="var(--bg)" stroke-width="2.5" visibility="hidden"/>
  <rect id="proj-overlay" x="${PL}" y="${PT}" width="${cW}" height="${cH}" fill="transparent" cursor="crosshair"
    data-pl="${PL}" data-pt="${PT}" data-cw="${cW}" data-ch="${cH}" data-w="${W}" data-h="${H}" data-years="${years}" data-maxval="${maxVal.toFixed(2)}"/>
</svg>
<div class="proj-hover-label" id="proj-hlabel" hidden></div>`;
}

function buildProjectionSummary(v0, monthly, rate, years) {
  const rm=rate/12, t=years*12;
  const finalVal=rm>0 ? v0*Math.pow(1+rm,t)+monthly*(Math.pow(1+rm,t)-1)/rm : v0+monthly*t;
  const totalIn=v0+monthly*12*years;
  const gains=finalVal-totalIn;
  return `
    <div class="proj-stat">
      <div class="proj-stat-label">Valeur finale (an ${years})</div>
      <div class="proj-stat-value c-pos">${fmtEur(finalVal,0)}</div>
    </div>
    <div class="proj-stat">
      <div class="proj-stat-label">Total injecté</div>
      <div class="proj-stat-value">${fmtEur(totalIn,0)}</div>
    </div>
    <div class="proj-stat">
      <div class="proj-stat-label">Intérêts générés</div>
      <div class="proj-stat-value c-pos">+${fmtEur(Math.max(0,gains),0)}</div>
    </div>`;
}

function buildViewProjection(positions) {
  const v0=Math.round(positions.reduce((s,p)=>s+valOf(p),0));
  return `<div class="proj-container">
    <div class="proj-inputs">
      <div class="proj-input-group">
        <label class="proj-input-label">Capital initial (€)</label>
        <input class="proj-input-field" id="proj-v0" type="number" min="0" step="100" value="${v0}">
      </div>
      <div class="proj-input-group">
        <label class="proj-input-label">Injection / mois (€)</label>
        <input class="proj-input-field" id="proj-monthly" type="number" min="0" step="50" value="500">
      </div>
      <div class="proj-input-group">
        <label class="proj-input-label">Rendement annuel (%)</label>
        <input class="proj-input-field" id="proj-rate" type="number" min="0" step="0.5" value="8">
      </div>
      <div class="proj-input-group">
        <label class="proj-input-label">Horizon (années)</label>
        <input class="proj-input-field" id="proj-years" type="number" min="1" max="50" step="1" value="20">
      </div>
    </div>
    <div class="proj-chart-wrap" id="proj-chart-wrap">
      ${buildProjectionChart(v0, 500, 0.08, 20)}

function render(positions) {
  _allPositions = positions;

  positions.forEach(p => {
    p._priceChanged = p.currentPrice != null &&
      _prevPrices.has(p.ticker) &&
      _prevPrices.get(p.ticker) !== p.currentPrice;
    if (p.currentPrice != null) _prevPrices.set(p.ticker, p.currentPrice);
  });

  const updated = new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});

  document.getElementById('pf-root').innerHTML = `
    ${buildViewNav()}
    <div id="pf-view-content">${buildCurrentView(positions)}</div>
    <div class="pf-footer">
      <span><span class="live-dot"></span>Mis à jour le ${updated}</span>
      <button class="pf-refresh" onclick="loadPortfolio()">↻ Actualiser</button>
    </div>`;

  initChartInteractions();
  if (_currentView === 'projection') initProjectionChart();

  if (_firstLoad) {
    _firstLoad = false;
    document.querySelectorAll('[data-count-target]').forEach(el => {
      const t = parseFloat(el.dataset.countTarget);
      if (!isNaN(t)) animateCounter(el, t, 1100);
    });
  }

  positions.filter(p=>p._priceChanged).forEach(p => {
    const el = document.querySelector(`[data-ticker="${p.ticker}"] .price-live`);
    if (el) { el.classList.remove('price-pulse'); void el.offsetWidth; el.classList.add('price-pulse'); }
  });
}

function initDonutHovers() {
  document.querySelectorAll('.donut-svg').forEach(svg => {
    const arcs = [...svg.querySelectorAll('.donut-arc')];
    if (!arcs.length) return;
    const donutId = svg.dataset.donut;
    const legend  = document.querySelector(`.donut-legend[data-donut="${donutId}"]`);
    const legRows = legend ? [...legend.querySelectorAll('.legend-row')] : [];
    const clabel  = svg.querySelector('.donut-center-label');
    const cpct    = svg.querySelector('.donut-center-pct');
    let curIdx = -1;

    function apply(idx) {
      if (idx === curIdx) return;
      curIdx = idx;
      arcs.forEach((a, i) => {
        if (idx === -1) {
          a.style.opacity = ''; a.style.strokeWidth = '';
        } else {
          const active = i === idx;
          a.style.opacity     = active ? '1' : '0.15';
          a.style.strokeWidth = active ? '20' : '16';
        }
      });
      legRows.forEach((r, i) => { r.style.opacity = idx === -1 ? '' : (i === idx ? '1' : '0.28'); });
      if (clabel && cpct) {
        if (idx === -1) {
          clabel.style.opacity = '0';
          cpct.style.opacity   = '0';
        } else {
          let lbl = arcs[idx]?.dataset.label || '';
          if (lbl.length > 11) lbl = lbl.slice(0,9) + '…';
          clabel.textContent  = lbl;
          cpct.textContent    = arcs[idx]?.dataset.pct || '';
          cpct.style.fill     = arcs[idx]?.dataset.color || '';
          clabel.style.opacity = '1';
          cpct.style.opacity   = '1';
        }
      }
    }

    // mousemove évite le déclenchement au re-render DOM (curseur stationnaire)
    const container = svg.closest('.chart-inner');
    if (container) {
      container.addEventListener('mousemove', e => {
        const t = e.target.closest('.donut-arc, .legend-row[data-idx]');
        apply(t ? parseInt(t.dataset.idx) : -1);
      });
      container.addEventListener('mouseleave', () => apply(-1));
    }
  });
}

function initBarHovers() {
  const barSection = document.querySelector('.bar-section');
  if (!barSection) return;
  const tooltip = document.getElementById('pf-tooltip');
  let hoveredRow = null;

  function clearHover() {
    barSection.querySelectorAll('.bar-row[data-ticker]').forEach(r => r.classList.remove('bar-dimmed','bar-focused'));
    hoveredRow = null;
    if (tooltip) tooltip.hidden = true;
  }

  function applyHover(row) {
    if (row === hoveredRow) return;
    hoveredRow = row;
    const all = barSection.querySelectorAll('.bar-row[data-ticker]');
    all.forEach(r => {
      r.classList.toggle('bar-dimmed', !!row && r !== row);
      r.classList.toggle('bar-focused', r === row);
    });
    if (!row || !tooltip) { if (tooltip) tooltip.hidden = true; return; }
    tooltip.innerHTML = `
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">
        <span style="width:10px;height:10px;border-radius:50%;background:${row.dataset.color};flex-shrink:0;display:inline-block"></span>
        <strong style="font-size:12.5px;color:var(--text)">${row.dataset.nom}</strong>
      </div>
      <div style="font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:8px">${row.dataset.ticker}</div>
      <div style="display:flex;justify-content:space-between;gap:12px">
        <span style="color:var(--muted)">Valeur</span>
        <span style="font-weight:700;color:var(--text)">${row.dataset.val}</span>
      </div>
      <div style="display:flex;justify-content:space-between;gap:12px;margin-top:4px">
        <span style="color:var(--muted)">Part</span>
        <span style="font-weight:600;color:var(--text)">${row.dataset.pct}</span>
      </div>
      <div style="display:flex;justify-content:space-between;gap:12px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">
        <span style="color:var(--muted)">P&amp;L</span>
        <span style="font-weight:600" class="${row.dataset.pnlcls}">${row.dataset.pnl}</span>
      </div>`;
    tooltip.hidden = false;
  }

  barSection.addEventListener('mouseover', e => {
    const row = e.target.closest('.bar-row[data-ticker]');
    applyHover(row || null);
  });
  barSection.addEventListener('mousemove', e => {
    if (tooltip && !tooltip.hidden) {
      const x = Math.min(e.clientX + 18, window.innerWidth - 250);
      const y = Math.min(e.clientY - 10,  window.innerHeight - 130);
      tooltip.style.left = x + 'px';
      tooltip.style.top  = y + 'px';
    }
  });
  barSection.addEventListener('mouseleave', clearHover);
}

function initChartInteractions() {
  initDonutHovers();
  initBarHovers();
}

function switchView(view) {
  _currentView = view;
  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  const content = document.getElementById('pf-view-content');
  if (content) {
    content.innerHTML = buildCurrentView(_allPositions);
    initChartInteractions();
    if (view === 'projection') initProjectionChart();
  }
}

function initProjectionChart() {
  const overlay = document.getElementById('proj-overlay');
  const svg     = document.getElementById('proj-svg');
  const vline   = document.getElementById('proj-vline');
  const dot     = document.getElementById('proj-dot');
  const hlabel  = document.getElementById('proj-hlabel');
  if (!overlay || !svg || !vline || !dot) return;

  const getParams = () => ({
    v0:      parseFloat(document.getElementById('proj-v0')?.value)||0,
    monthly: parseFloat(document.getElementById('proj-monthly')?.value)||0,
    rate:   (parseFloat(document.getElementById('proj-rate')?.value)||0)/100,
    years:   Math.max(1,Math.min(50,parseInt(document.getElementById('proj-years')?.value)||20)),
  });

  overlay.addEventListener('mousemove', e => {
    const {v0,monthly,rate,years} = getParams();
    const pts = calcProjection(v0, monthly, rate, years);
    const maxVal = Math.max(...pts.map(p=>p.val),1);

    const PL=parseFloat(overlay.dataset.pl), PT=parseFloat(overlay.dataset.pt);
    const cW=parseFloat(overlay.dataset.cw), cH=parseFloat(overlay.dataset.ch);
    const VW=parseFloat(overlay.dataset.w),  VH=parseFloat(overlay.dataset.h);

    const svgRect = svg.getBoundingClientRect();
    const vbX = (e.clientX - svgRect.left) / svgRect.width * VW;
    const ny = Math.max(0, Math.min(years, Math.round((vbX - PL) / cW * years)));
    const pt = pts[ny];
    const px = (PL + (ny/years)*cW).toFixed(1);
    const py = (PT + cH - (pt.val/maxVal)*cH).toFixed(1);

    vline.setAttribute('x1',px); vline.setAttribute('x2',px);
    vline.setAttribute('visibility','visible');
    dot.setAttribute('cx',px); dot.setAttribute('cy',py);
    dot.setAttribute('visibility','visible');

    if (hlabel) {
      const gains = pt.val - pt.noY;
      hlabel.innerHTML = `
        <div style="font-weight:700;color:var(--text);margin-bottom:6px">Année ${pt.y}</div>
        <div style="display:flex;justify-content:space-between;gap:14px"><span style="color:#a78bfa">Valeur</span><span style="font-weight:700;color:#a78bfa">${fmtEur(pt.val,0)}</span></div>
        <div style="display:flex;justify-content:space-between;gap:14px;margin-top:3px"><span style="color:var(--muted)">Injecté</span><span style="color:var(--dim)">${fmtEur(pt.noY,0)}</span></div>
        <div style="display:flex;justify-content:space-between;gap:14px;margin-top:3px"><span style="color:var(--muted)">Intérêts</span><span style="color:#22c55e">+${fmtEur(Math.max(0,gains),0)}</span></div>`;
      const wrap = document.getElementById('proj-chart-wrap');
      if (wrap) {
        const wr = wrap.getBoundingClientRect();
        let lx = e.clientX - wr.left + 16;
        if (lx + 160 > wr.width) lx = e.clientX - wr.left - 176;
        hlabel.style.left = Math.max(0,lx) + 'px';
        hlabel.style.top  = Math.max(10, e.clientY - wr.top - 20) + 'px';
        hlabel.hidden = false;
      }
    }
  });

  overlay.addEventListener('mouseleave', () => {
    vline.setAttribute('visibility','hidden');
    dot.setAttribute('visibility','hidden');
    if (hlabel) hlabel.hidden = true;
  });
}

function updateProjectionChart() {
  const v0      = parseFloat(document.getElementById('proj-v0')?.value)||0;
  const monthly = parseFloat(document.getElementById('proj-monthly')?.value)||0;
  const rate    = (parseFloat(document.getElementById('proj-rate')?.value)||0)/100;
  const years   = Math.max(1,Math.min(50,parseInt(document.getElementById('proj-years')?.value)||20));
  const wrap    = document.getElementById('proj-chart-wrap');
  const summary = document.getElementById('proj-summary');
  if (wrap)    wrap.innerHTML    = buildProjectionChart(v0, monthly, rate, years);
  if (summary) summary.innerHTML = buildProjectionSummary(v0, monthly, rate, years);
  initProjectionChart();
}

  const th  = e.target.closest('th[data-sort-col]');

    _filterActive = tab.dataset.filter;

function openAddModal() {
  if (!APPS_SCRIPT_URL) { showToast('Configure d\'abord APPS_SCRIPT_URL.','err'); return; }
  document.getElementById('addModal').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeAddModal() {
  document.getElementById('addModal').hidden = true;
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAddModal();
  if (e.key === 'r' && !e.metaKey && !e.ctrlKey && !e.shiftKey && document.activeElement?.tagName !== 'INPUT') {
    loadPortfolio();
  }
});
document.getElementById('addModal').addEventListener('click', e => { if (e.target===e.currentTarget) closeAddModal(); });

function showToast(msg, type='ok') {
  const t = document.getElementById('pfToast');
  t.textContent = msg; t.className = `pf-toast ${type}`;
  void t.offsetWidth; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3500);
}

async function submitPosition() {
  const get = id => document.getElementById(id).value.trim();
  const nom=get('f-nom'), ticker=get('f-ticker'), qty=parseFloat(get('f-qty')), avg=parseFloat(get('f-avg'));
  if (!nom)          { showToast('Renseigne le nom.','err'); return; }
  if (!ticker)       { showToast('Renseigne le ticker / ISIN.','err'); return; }
  if (!qty||qty<=0)  { showToast('Quantité invalide.','err'); return; }
  if (isNaN(avg)||avg<0) { showToast('Prix moyen invalide.','err'); return; }
  const btn=document.getElementById('f-submit');
  btn.disabled=true; btn.textContent='Envoi…';
  const params=new URLSearchParams({
    compte:get('f-compte'), classe:get('f-classe'), nom, ticker,
    priceType:get('f-priceType'), qty:qty.toString(), avgPrice:avg.toString(),
    apyDiv:((parseFloat(get('f-apyDiv'))||0)/100).toString(),
    apyStk:((parseFloat(get('f-apyStk'))||0)/100).toString(),
    notes:get('f-notes'),
  });
  try {
    const res=await fetch(`${APPS_SCRIPT_URL}?${params}`,{signal:AbortSignal.timeout(12000)});
    const json=await res.json();
    if (!json.ok) throw new Error(json.err||'Erreur Apps Script');
    showToast('Position ajoutée ! Rechargement dans 3s…','ok');
    closeAddModal();
    setTimeout(loadPortfolio,3000);
  } catch(e) { showToast('Erreur : '+e.message,'err'); }
  finally { btn.disabled=false; btn.textContent='Ajouter dans le Sheet'; }
}

// ════════════════════════════════════════════════════════════════
//  LOAD
// ════════════════════════════════════════════════════════════════

async function loadPortfolio() {
  const root = document.getElementById('pf-root');
  root.innerHTML = '<div class="pf-loading">Chargement du portefeuille…</div>';
  try {
    const res = await fetch(SHEET_URL,{signal:AbortSignal.timeout(12000)});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const csv = await res.text();
    const sheetPositions = parseCSV(csv);
    if (!sheetPositions.length) throw new Error('Aucune position trouvée.');

    sheetPositions.forEach(p => {
      const stkQty = STAKING_TOKENS[p.ticker];
      if (stkQty !== undefined && stkQty > 0) p.qtyBought = Math.max(0, p.qty - stkQty);
    });

    const manualActive = MANUAL.filter(p=>p.qty>0);
    await fetchManualPrices(manualActive);
    render([...sheetPositions, ...manualActive]);
  } catch(e) {
    root.innerHTML=`<div class="pf-error">Impossible de charger : ${e.message}<br><small>Vérifie que le Google Sheet est bien publié sur le web.</small></div>`;
  }
}

loadPortfolio();
</script>
