<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlaZma — Haito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body{display:flex;flex-direction:column;align-items:center;padding-bottom:64px}
  .pg{width:100%;max-width:var(--page-max);padding:0 var(--gut)}

  @keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes logo-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  @keyframes logo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes sep-grow{from{width:0;opacity:0}to{width:64px;opacity:1}}
  @keyframes title-in{from{opacity:0;letter-spacing:.2em;filter:blur(4px)}to{opacity:1;letter-spacing:.04em;filter:none}}

  .hero{text-align:center;padding:64px 0 40px}
  .hero-ico{
    width:96px;height:96px;border-radius:26px;margin:0 auto 22px;
    background:rgba(192,38,211,.10);border:1px solid rgba(192,38,211,.28);
    display:flex;align-items:center;justify-content:center;font-size:46px;
    animation:logo-in .55s cubic-bezier(.16,1,.3,1) both, logo-float 7s ease-in-out infinite .6s;
  }
  .hero-ico:hover{animation-play-state:paused,paused}
  .hero h1{
    font-size:clamp(38px,7vw,66px);letter-spacing:.04em;margin-bottom:10px;
    animation:title-in .85s cubic-bezier(.16,1,.3,1) both .12s;
  }
  .hero-badge{animation:fade-up .5s cubic-bezier(.16,1,.3,1) both .4s;display:inline-block;margin-bottom:12px}
  .hero-sep{
    display:block;height:2px;
    background:linear-gradient(90deg,transparent,#c026d3,transparent);
    margin:0 auto;border-radius:1px;
    animation:sep-grow .75s cubic-bezier(.16,1,.3,1) both .45s;
  }

  .sec{
    margin-top:44px;opacity:0;transform:translateY(20px);
    transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1);
  }
  .sec.visible{opacity:1;transform:none}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .sec-head h2{font-size:15px;font-weight:600;letter-spacing:.02em}
  .sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

  .content-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:26px;border-left:3px solid #c026d3;
  }
  .content-card p{color:var(--dim);line-height:1.7;font-size:14.5px}
  .content-card p+p{margin-top:12px}
  .placeholder{color:var(--muted);font-style:italic;font-size:13.5px}

  .role-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .role-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:16px 10px;text-align:center;
  }
  .role-icon{font-size:22px;margin-bottom:6px}
  .role-name{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .role-player{font-family:var(--font-display);font-size:14px;font-weight:600;margin-top:4px;color:#c026d3}

  .link-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:20px 24px;display:flex;align-items:center;justify-content:space-between;
    transition:border-color .2s,background .2s;
  }
  .link-card:hover{background:var(--surface-2);border-color:rgba(192,38,211,.28)}
  .link-card-label{font-family:var(--font-display);font-size:15px;font-weight:600}
  .link-card-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .link-arr{color:#c026d3;font-size:18px}

  @media(max-width:520px){.role-grid{grid-template-columns:repeat(3,1fr)}}

  footer{
    margin-top:52px;padding-top:22px;border-top:1px solid var(--border);width:100%;
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
    color:var(--muted);font-size:12px;
    opacity:0;animation:fade-up .5s cubic-bezier(.16,1,.3,1) forwards 1s;
  }
  footer a{color:var(--dim);transition:color .15s}
  footer a:hover{color:#c026d3}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .sec{opacity:1;transform:none}
  }
</style>
</head>
<body>

<nav class="ht-topbar">
  <div class="ht-topbar-inner">
    <a class="ht-brand" href="index.html">
      <span class="ht-brand-dot">H</span>
      Haito
    </a>
    <nav class="ht-nav">
      <a href="roman.html">Roman</a>
      <a href="nilo.html">Nilo</a>
      <a href="vinx.html">VinX Ledger</a>
      <a href="plazma.html" class="active">PlaZma</a>
      <a href="archi.html">ARCHI</a>
    </nav>
  </div>
</nav>

<div class="pg">

  <header class="hero">
    <div class="hero-ico">⚡</div>
    <div class="hero-badge"><span class="badge status-active">Actif</span></div>
    <h1>PlaZma</h1>
    <span class="hero-sep"></span>
  </header>

  <section class="sec">
    <div class="sec-head"><h2>À propos</h2><span class="line"></span></div>
    <div class="content-card">
      <p class="placeholder">Ajoute ici la description de PlaZma — histoire de l'équipe, objectifs, palmarès, vision.</p>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Roster</h2><span class="line"></span></div>
    <div class="role-grid">
      <div class="role-card">
        <div class="role-icon">🛡️</div>
        <div class="role-name">Top</div>
        <div class="role-player">—</div>
      </div>
      <div class="role-card">
        <div class="role-icon">🌿</div>
        <div class="role-name">Jungle</div>
        <div class="role-player">—</div>
      </div>
      <div class="role-card">
        <div class="role-icon">⚔️</div>
        <div class="role-name">Mid</div>
        <div class="role-player">—</div>
      </div>
      <div class="role-card">
        <div class="role-icon">🏹</div>
        <div class="role-name">ADC</div>
        <div class="role-player">—</div>
      </div>
      <div class="role-card">
        <div class="role-icon">💫</div>
        <div class="role-name">Support</div>
        <div class="role-player">—</div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Liens</h2><span class="line"></span></div>
    <a class="link-card" href="archi.html">
      <div>
        <div class="link-card-label">ARCHI</div>
        <div class="link-card-sub">Plateforme de gestion de l'équipe</div>
      </div>
      <span class="link-arr">→</span>
    </a>
  </section>

  <footer>
    <a href="index.html">← Tous les projets</a>
    <span style="color:var(--border-2)">·</span>
    <span>Haito</span>
  </footer>

</div>

<script src="assets/haito.js"></script>
<script>
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); }});
  }, {threshold:.08});
  document.querySelectorAll('.sec').forEach(s => obs.observe(s));
</script>
</body>
</html>
